<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SpectraMuse — Where stories become color, sound, and motion</title>
<meta name="description" content="SpectraMuse turns written stories into moving color, texture, and sound so creators can record and share living story performances." />
<link rel="canonical" href="https://spectramuse.com/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="SpectraMuse" />
<meta property="og:title" content="SpectraMuse — Where stories become color, sound, and motion" />
<meta property="og:description" content="A synesthetic typewriter for living stories. Write, watch, listen, record, and share your story as color, texture, and sound." />
<meta property="og:url" content="https://spectramuse.com/" />
<meta property="og:image" content="https://spectramuse.com/assets/spectramuse-social.png" />
<meta property="og:image:secure_url" content="https://spectramuse.com/assets/spectramuse-social.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="SpectraMuse story performance preview with color and sound waves" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="SpectraMuse — Where stories become color, sound, and motion" />
<meta name="twitter:description" content="A synesthetic typewriter for living stories. Write, watch, listen, record, and share your story as color, texture, and sound." />
<meta name="twitter:image" content="https://spectramuse.com/assets/spectramuse-social.png" />
<meta name="twitter:image:alt" content="SpectraMuse story performance preview with color and sound waves" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309080b'/%3E%3Ccircle cx='22' cy='24' r='14' fill='%23ffcc7a'/%3E%3Ccircle cx='42' cy='40' r='16' fill='%237ac7ff' fill-opacity='.82'/%3E%3Cpath d='M17 45h30' stroke='%23f8efe2' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #f8efe2;
    --panel-ink: #f8efe2;
    --muted: rgba(248,239,226,.68);
    --line: rgba(255,255,255,.16);
    --panel: rgba(0,0,0,.26);
    --panel-strong: rgba(0,0,0,.36);
    --accent: #ffcc7a;
    --hue: 32;
    --hue2: 210;
    --motion-scale: 1;
    --glow-strength: 1;
    --particle-opacity: .35;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html { background: #09080b; }

  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Courier New", Courier, monospace;
    color: var(--ink);
    background:
      radial-gradient(circle at 26% 20%, rgba(98,47,125,.34), transparent 36%),
      radial-gradient(circle at 78% 70%, rgba(31,76,115,.25), transparent 35%),
      linear-gradient(145deg, #050407 0%, #100a18 45%, #07070b 100%);
  }

  body[data-preset="inverted"] {
    --ink: #151018;
    --panel-ink: #151018;
    --muted: rgba(21,16,24,.7);
    --line: rgba(21,16,24,.18);
    --panel: rgba(255,255,255,.42);
    --panel-strong: rgba(255,255,255,.58);
    color-scheme: light;
    background:
      radial-gradient(circle at 24% 24%, rgba(255,198,232,.46), transparent 34%),
      radial-gradient(circle at 76% 72%, rgba(130,190,255,.34), transparent 34%),
      linear-gradient(145deg, #fbf7ff 0%, #efe7ff 52%, #fff8f0 100%);
  }

  body[data-mode="lite"] {
    --ink: #f8efe2;
    --panel-ink: #f8efe2;
    --muted: rgba(248,239,226,.62);
    --line: rgba(255,255,255,.11);
    --panel: rgba(5,6,9,.74);
    --panel-strong: rgba(10,11,15,.84);
    background:
      radial-gradient(circle at 50% 40%, rgba(255,204,122,.08), transparent 32%),
      radial-gradient(circle at 74% 68%, rgba(122,199,255,.06), transparent 30%),
      linear-gradient(145deg, #020204 0%, #07070a 52%, #010103 100%);
  }

  body[data-mode="studio"] {
    --ink: #fff5ea;
    --panel-ink: #fff5ea;
    --muted: rgba(255,245,234,.7);
    --line: rgba(255,255,255,.18);
    --panel: rgba(16,8,28,.42);
    --panel-strong: rgba(10,17,32,.48);
    background:
      radial-gradient(circle at 18% 16%, rgba(255,83,190,.36), transparent 34%),
      radial-gradient(circle at 72% 24%, rgba(125,87,255,.3), transparent 32%),
      radial-gradient(circle at 78% 74%, rgba(25,214,207,.24), transparent 34%),
      linear-gradient(145deg, #06020b 0%, #24103b 48%, #06151f 100%);
  }

  #stage {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  body[data-mode="lite"] #stage { opacity: .36; }
  body[data-mode="studio"] #stage { opacity: .92; }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .2;
    mix-blend-mode: overlay;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.14) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(0,0,0,.22) 0 1px, transparent 1px);
    background-size: 5px 5px, 7px 7px;
    animation: crawl calc(1.5s / max(var(--motion-scale), .45)) steps(4) infinite;
    z-index: 1;
  }

  body[data-mode="lite"] .grain { opacity: .08; }
  body[data-mode="studio"] .grain { opacity: .22; }

  @keyframes crawl {
    from { transform: translate(0,0); }
    to { transform: translate(-12px, 9px); }
  }

  .app-shell {
    position: relative;
    z-index: 2;
    width: min(1180px, calc(100vw - 28px));
    min-height: calc(100vh - 28px);
    margin: 14px auto;
    padding: 16px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 28px;
    background: linear-gradient(145deg, rgba(9,8,11,.84), rgba(44,22,51,.42));
    box-shadow: 0 24px 120px rgba(0,0,0,.62);
    backdrop-filter: blur(16px);
    display: grid;
    grid-template-columns: minmax(330px, .98fr) minmax(320px, 1.02fr);
    gap: 14px;
  }

  body[data-preset="inverted"] .app-shell {
    background: linear-gradient(145deg, rgba(255,255,255,.74), rgba(240,231,255,.48));
    box-shadow: 0 24px 100px rgba(72,52,103,.2);
  }

  body[data-mode="lite"] .app-shell {
    width: min(890px, calc(100vw - 24px));
    grid-template-columns: 1fr;
  }

  body[data-mode="lite"] .app-shell {
    border-color: rgba(255,255,255,.11);
    background: linear-gradient(145deg, rgba(5,6,9,.9), rgba(8,8,12,.7));
    box-shadow: 0 22px 90px rgba(0,0,0,.7);
  }

  body[data-mode="studio"] .app-shell {
    border-color: rgba(255,255,255,.2);
    background: linear-gradient(145deg, rgba(20,8,34,.7), rgba(4,20,29,.46));
    box-shadow:
      0 28px 130px rgba(0,0,0,.62),
      0 0 90px rgba(210,64,190,.12);
  }

  .panel {
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: var(--panel);
    overflow: hidden;
  }

  .writer {
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 18px 10px;
    border-bottom: 1px solid var(--line);
  }

  h1 {
    margin: 0;
    font-size: clamp(32px, 4.4vw, 56px);
    letter-spacing: 0;
    line-height: .96;
    overflow-wrap: anywhere;
  }

  .tagline {
    margin: 10px 0 0;
    color: var(--muted);
    line-height: 1.35;
  }

  .mode-switch {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,.05);
  }

  .mode-switch button {
    min-height: 38px;
    padding: 8px 10px;
    color: var(--panel-ink);
    background: transparent;
  }

  body[data-mode="lite"] #liteToggle,
  body[data-mode="studio"] #studioToggle {
    color: #09080b;
    background: var(--accent);
  }

  .sensory-panel {
    display: grid;
    gap: 12px;
    padding: 14px 18px 16px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 24px;
  }

  .legend i {
    width: 28px;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), hsl(var(--hue2) 100% 72%));
    box-shadow: 0 0 12px var(--accent);
  }

  .legend .sound-mark {
    height: 18px;
    width: 34px;
    background:
      linear-gradient(90deg, transparent 0 10%, var(--accent) 10% 18%, transparent 18% 30%, hsl(var(--hue2) 100% 72%) 30% 38%, transparent 38% 52%, var(--accent) 52% 60%, transparent 60%);
    box-shadow: none;
  }

  .text-shell {
    position: relative;
    min-height: 360px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.035), transparent 24%),
      rgba(0,0,0,.18);
    overflow: hidden;
  }

  body[data-mode="lite"] .text-shell { min-height: 420px; }
  body[data-mode="lite"] .text-shell {
    border-color: rgba(255,255,255,.12);
    background:
      linear-gradient(180deg, rgba(255,255,255,.018), transparent 22%),
      rgba(0,0,0,.36);
  }
  body[data-mode="studio"] .text-shell {
    border-color: rgba(255,255,255,.17);
    background:
      radial-gradient(circle at 20% 0%, rgba(255,83,190,.08), transparent 32%),
      radial-gradient(circle at 82% 100%, rgba(25,214,207,.08), transparent 34%),
      linear-gradient(180deg, rgba(255,255,255,.045), transparent 24%),
      rgba(5,4,12,.24);
  }
  .letter-layer,
  textarea {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 18px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font: 18px/1.55 "Courier New", Courier, monospace;
  }

  .letter-layer {
    z-index: 1;
    color: rgba(248,239,226,.46);
    pointer-events: none;
  }

  textarea {
    z-index: 2;
    resize: none;
    border: 0;
    outline: none;
    color: transparent;
    -webkit-text-fill-color: transparent;
    caret-color: var(--ink);
    background: transparent;
  }

  textarea::selection {
    color: transparent;
    background: rgba(255,255,255,.18);
  }

  .letter {
    color: var(--letter-color);
    text-shadow:
      0 0 calc(5px * var(--glow-strength) * var(--letter-glow)) currentColor,
      0 0 calc(14px * var(--glow-strength) * var(--letter-glow)) color-mix(in srgb, currentColor 72%, transparent);
    transition: color 180ms ease, text-shadow 180ms ease;
  }

  .letter.active-word {
    text-decoration-line: underline;
    text-decoration-color: currentColor;
    text-decoration-thickness: 2px;
    text-underline-offset: .2em;
  }

  body[data-preset="colorBlind"] .letter {
    text-decoration-line: underline;
    text-decoration-style: var(--underline-style);
    text-decoration-color: currentColor;
    text-decoration-thickness: 1px;
    text-underline-offset: .24em;
  }

  .empty-hint {
    color: var(--muted);
  }

  .sensory-footer {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .controls,
  .settings {
    display: grid;
    gap: 9px;
    padding: 0 18px 14px;
  }

  .controls {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lite-settings {
    grid-template-columns: 1fr;
    padding-top: 0;
  }

  .studio-settings {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .field {
    display: grid;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
  }

  button,
  select,
  input[type="range"] {
    font: 700 14px/1 "Courier New", Courier, monospace;
  }

  button,
  .select-wrap {
    min-height: 44px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px;
  }

  button {
    cursor: pointer;
    padding: 11px 13px;
    color: #09080b;
    background: var(--accent);
  }

  button.secondary {
    color: var(--panel-ink);
    background: rgba(255,255,255,.08);
  }

  button.ghost {
    color: var(--muted);
    background: rgba(0,0,0,.16);
  }

  button.danger {
    color: white;
    background: linear-gradient(180deg, #ff686d, #ff4e56);
  }

  button:active { transform: translateY(1px); }
  button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .select-wrap {
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: rgba(255,255,255,.06);
  }

  select {
    width: 100%;
    border: 0;
    outline: 0;
    color: var(--panel-ink);
    background: transparent;
  }

  option {
    color: #151018;
    background: #f8efe2;
  }

  input[type="range"] {
    accent-color: var(--accent);
    width: 100%;
  }

  .visualizer {
    position: relative;
    overflow: hidden;
    min-height: 620px;
  }

  body[data-mode="lite"] .visualizer { min-height: 260px; }

  body[data-mode="lite"] .visualizer {
    background:
      linear-gradient(180deg, rgba(255,255,255,.018), transparent 34%),
      rgba(0,0,0,.26);
  }

  body[data-mode="studio"] .visualizer {
    background:
      radial-gradient(circle at 44% 36%, rgba(255,83,190,.12), transparent 34%),
      radial-gradient(circle at 68% 70%, rgba(25,214,207,.1), transparent 36%),
      var(--panel);
  }

  .visual-copy {
    position: absolute;
    left: 18px;
    right: 18px;
    top: 18px;
    z-index: 3;
  }

  .visual-copy p {
    margin: 0;
    color: var(--muted);
    line-height: 1.45;
  }

  .eyebrow {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .orb {
    position: absolute;
    width: 34vmin;
    height: 34vmin;
    border-radius: 50%;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle at 34% 32%, hsla(var(--hue), 100%, 76%, .96), transparent 28%),
      radial-gradient(circle at 64% 68%, hsla(var(--hue2), 100%, 72%, .82), transparent 34%),
      conic-gradient(from 90deg, hsla(var(--hue),100%,60%,.9), hsla(var(--hue2),100%,62%,.8), hsla(var(--hue),100%,60%,.9));
    filter: blur(.2px) saturate(1.25);
    box-shadow: 0 0 calc(90px * var(--glow-strength)) hsla(var(--hue), 100%, 70%, .45);
    animation: breathe calc(5s / max(var(--motion-scale), .45)) ease-in-out infinite;
  }

  body[data-mode="lite"] .orb {
    width: 42vmin;
    height: 42vmin;
    opacity: .58;
    filter: blur(.2px) saturate(.92);
    box-shadow: 0 0 calc(52px * var(--glow-strength)) hsla(var(--hue), 100%, 70%, .26);
  }

  body[data-mode="studio"] .orb {
    opacity: .96;
    box-shadow: 0 0 calc(110px * var(--glow-strength)) hsla(var(--hue), 100%, 70%, .48);
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(.9) rotate(0deg); }
    50% { transform: translate(-50%, -50%) scale(1.12) rotate(14deg); }
  }

  .wave {
    position: absolute;
    inset: auto 20px 28px;
    height: 140px;
    display: flex;
    align-items: end;
    gap: 7px;
  }

  body[data-mode="lite"] .wave {
    height: 92px;
    inset: auto 18px 22px;
    opacity: .68;
  }

  body[data-mode="studio"] .wave {
    opacity: .95;
  }

  .bar {
    flex: 1;
    min-width: 4px;
    border-radius: 999px;
    background: linear-gradient(to top, hsla(var(--hue2),100%,70%,.35), hsla(var(--hue),100%,76%,.9));
    transform-origin: bottom;
    animation: pulse calc(900ms / max(var(--motion-scale), .45)) ease-in-out infinite alternate;
  }

  @keyframes pulse {
    from { transform: scaleY(.25); opacity: .45; }
    to { transform: scaleY(1); opacity: .95; }
  }

  .status-card {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 184px;
    z-index: 3;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .readout {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px;
    background: var(--panel-strong);
  }

  .readout strong {
    display: block;
    font-size: 18px;
    color: var(--accent);
  }

  .readout span {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
  }

  .status {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 152px;
    z-index: 3;
    color: var(--muted);
    font-size: 13px;
  }

  body[data-mode="lite"] .studio-only { display: none !important; }
  body[data-mode="studio"] .lite-only { display: none !important; }
  body[data-mode="studio"] .lite-settings { display: none; }
  body[data-mode="lite"] .status-card,
  body[data-mode="lite"] .visual-copy { display: none; }

  @media (max-width: 820px) {
    .app-shell {
      width: calc(100vw - 20px);
      min-height: auto;
      margin: 10px auto;
      border-radius: 22px;
      padding: 10px;
      grid-template-columns: 1fr;
    }

    h1 { font-size: clamp(34px, 10vw, 44px); }
    .tagline { font-size: 14px; }
    .text-shell, body[data-mode="lite"] .text-shell { min-height: 340px; }
    body[data-mode="studio"] .text-shell { min-height: 300px; }
    .letter-layer, textarea { font-size: 16px; padding: 16px; }
    .studio-settings { grid-template-columns: 1fr; }
    .visualizer, body[data-mode="lite"] .visualizer { min-height: 260px; }
    .orb { width: 58vmin; height: 58vmin; }
    .wave { height: 88px; inset: auto 12px 18px; gap: 5px; }
    .status-card { left: 12px; right: 12px; bottom: 126px; gap: 7px; }
    .readout { padding: 8px; }
    .readout strong { font-size: 15px; }
    .readout span { font-size: 10px; }
    .status { left: 12px; right: 12px; bottom: 104px; font-size: 12px; }

    body[data-mode="studio"] .writer { display: contents; }
    body[data-mode="studio"] header { order: 1; }
    body[data-mode="studio"] .sensory-panel { order: 2; }
    body[data-mode="studio"] .visualizer { order: 3; }
    body[data-mode="studio"] .controls { order: 4; }
    body[data-mode="studio"] .studio-settings { order: 5; }
  }

  @media (max-width: 470px) {
    h1 { font-size: clamp(32px, 9.6vw, 40px); }
    .controls { grid-template-columns: 1fr; }
    .sensory-panel, header, .controls, .settings { padding-left: 14px; padding-right: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .grain, .orb, .bar { animation-duration: 8s; }
  }
</style>
</head>
<body data-mode="lite" data-preset="normal">
<canvas id="stage" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<main class="app-shell">
  <section class="panel writer">
    <header>
      <h1>SpectraMuse</h1>
      <p class="tagline">Type a word. Each letter becomes color, tone, and motion.</p>
      <div class="mode-switch" aria-label="Choose Lite or Studio">
        <button id="liteToggle" type="button" data-mode-target="lite">Lite</button>
        <button id="studioToggle" type="button" data-mode-target="studio">Studio</button>
      </div>
    </header>

    <div class="sensory-panel">
      <div class="legend" aria-label="Sensory legend">
        <span><i aria-hidden="true"></i>Color</span>
        <span><i class="sound-mark" aria-hidden="true"></i>Sound</span>
      </div>
      <div class="text-shell">
        <div id="letterLayer" class="letter-layer" aria-hidden="true"></div>
        <textarea id="story" spellcheck="true" aria-label="Type words to generate color, sound, and motion">moon</textarea>
      </div>
      <p class="sensory-footer">Each letter has a color. Each color has a sound.</p>
    </div>

    <div class="controls">
      <button data-action="play">Play phrase</button>
      <button class="secondary studio-only" data-action="stop">Stop sound</button>
      <button class="secondary" data-action="sample">New sample</button>
      <button class="secondary lite-only" data-action="copy">Copy story</button>
      <button class="secondary studio-only" data-action="previewScene">Preview Scene</button>
      <button class="danger studio-only" data-action="saveMp4Story">Save MP4 Story</button>
      <button class="secondary studio-only" data-action="saveMp4Scene">Save MP4 Scene</button>
      <button class="secondary studio-only" data-action="saveImage">Save Image</button>
      <button class="secondary studio-only" data-action="copy">Copy Caption</button>
      <button class="secondary studio-only" data-action="save">Download Story</button>
      <button class="secondary studio-only" data-action="storyboard">Storyboard</button>
      <button class="ghost" data-action="clear">Clear</button>
    </div>

    <div class="settings lite-settings">
      <label class="field">Preset
        <span class="select-wrap">
          <select id="presetLite"></select>
        </span>
      </label>
    </div>

    <div class="settings studio-settings studio-only">
      <label class="field">Preset
        <span class="select-wrap">
          <select id="presetStudio"></select>
        </span>
      </label>
      <label class="field">Style
        <span class="select-wrap">
          <select id="palette"></select>
        </span>
      </label>
      <label class="field">Animation
        <span class="select-wrap">
          <select id="animationStyle">
            <option value="wave">Wave focus</option>
            <option value="orb">Orb bloom</option>
            <option value="rain">Soft rain</option>
            <option value="pulse">Quiet pulse</option>
          </select>
        </span>
      </label>
      <label class="field">Motion intensity
        <input id="intensity" type="range" min="25" max="100" value="74" />
      </label>
    </div>
  </section>

  <section class="panel visualizer" aria-label="Story visualizer">
    <div class="visual-copy">
      <p class="eyebrow">Living preview</p>
      <p>Letter tones feed the wave. Word motifs move the orb. Presets shape the same sensory engine.</p>
    </div>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <div class="status-card" aria-label="Mood signature">
      <div class="readout"><strong id="hueReadout">0</strong><span>hue</span></div>
      <div class="readout"><strong id="textureReadout">0</strong><span>texture</span></div>
      <div class="readout"><strong id="intensityReadout">0%</strong><span>intensity</span></div>
    </div>
    <p class="status" id="status">Ready.</p>
    <div class="wave" id="wave" aria-hidden="true"></div>
  </section>
</main>
<script type="module">
import {
  LITE_PRESETS,
  STUDIO_PRESETS,
  PRESENTATION_PRESETS,
  STORY_PALETTES,
  createSensoryAudio,
  getLetterProfile,
  getPalette,
  getPreset,
  getWordMotif,
  scoreStory
} from "./js/sensory-engine.js";

const MODE_KEY = "spectramuse-mode";
const LEGACY_MODE_KEY = "spectramuse-version";
const PRESET_KEY = "spectramuse-preset";
const PALETTE_KEY = "spectramuse-palette";
const ANIMATION_KEY = "spectramuse-animation";
const INTENSITY_KEY = "spectramuse-intensity";

const storyInput = document.getElementById("story");
const letterLayer = document.getElementById("letterLayer");
const orb = document.getElementById("orb");
const wave = document.getElementById("wave");
const status = document.getElementById("status");
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const presetLite = document.getElementById("presetLite");
const presetStudio = document.getElementById("presetStudio");
const paletteSelect = document.getElementById("palette");
const animationStyle = document.getElementById("animationStyle");
const intensity = document.getElementById("intensity");
const hueReadout = document.getElementById("hueReadout");
const textureReadout = document.getElementById("textureReadout");
const intensityReadout = document.getElementById("intensityReadout");
const audio = createSensoryAudio();

let lastValue = storyInput.value;
let sampleIndex = 0;
let particles = [];
const bursts = [];

const samples = [
  "moon",
  "Luna writes blue thunder in a quiet room.",
  "A velvet storm hums softly under the library floor.",
  "Mira folded sunlight into her pocket and every step rang gold.",
  "The city breathed neon rain after midnight."
];

const state = {
  mode: getInitialMode(),
  preset: readStorage(PRESET_KEY, "normal"),
  palette: readStorage(PALETTE_KEY, "classic"),
  animation: readStorage(ANIMATION_KEY, "wave"),
  intensity: Number(readStorage(INTENSITY_KEY, "74"))
};

for (let i = 0; i < 34; i += 1) {
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.style.height = `${20 + Math.random() * 130}px`;
  bar.style.animationDelay = `${Math.random() * 900}ms`;
  bar.style.animationDuration = `${620 + Math.random() * 900}ms`;
  wave.appendChild(bar);
}

function readStorage(key, fallback) {
  try {
    return localStorage.getItem(key) || fallback;
  } catch {
    return fallback;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {}
}

function getInitialMode() {
  const params = new URLSearchParams(location.search);
  const urlMode = params.get("mode");
  if (urlMode === "studio" || urlMode === "lite") return urlMode;
  const saved = readStorage(MODE_KEY, "") || readStorage(LEGACY_MODE_KEY, "");
  if (saved === "studio" || saved === "lite") return saved;
  return matchMedia("(max-width: 820px)").matches ? "lite" : "studio";
}

function allowedPresets() {
  return state.mode === "studio" ? STUDIO_PRESETS : LITE_PRESETS;
}

function normalizePresetForMode() {
  if (!allowedPresets().includes(state.preset)) {
    state.preset = "normal";
    writeStorage(PRESET_KEY, state.preset);
  }
}

function populatePresetSelect(select, values) {
  select.replaceChildren(...values.map(value => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = PRESENTATION_PRESETS[value].label;
    return option;
  }));
  select.value = state.preset;
}

function populatePaletteSelect() {
  paletteSelect.replaceChildren(...Object.entries(STORY_PALETTES).map(([value, palette]) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = palette.label;
    return option;
  }));
  paletteSelect.value = state.palette;
}

function setMode(mode, options = {}) {
  state.mode = mode === "studio" ? "studio" : "lite";
  normalizePresetForMode();
  document.body.dataset.mode = state.mode;
  document.body.dataset.version = state.mode;
  document.getElementById("liteToggle").setAttribute("aria-pressed", String(state.mode === "lite"));
  document.getElementById("studioToggle").setAttribute("aria-pressed", String(state.mode === "studio"));
  populatePresetSelect(presetLite, LITE_PRESETS);
  populatePresetSelect(presetStudio, STUDIO_PRESETS);
  if (options.persist !== false) {
    writeStorage(MODE_KEY, state.mode);
    writeStorage(LEGACY_MODE_KEY, state.mode);
  }
  renderAll(state.mode === "lite" ? "Lite mode keeps the generator simple." : "Studio mode unlocks the full control panel.");
}

function setPreset(preset, options = {}) {
  state.preset = PRESENTATION_PRESETS[preset] ? preset : "normal";
  normalizePresetForMode();
  document.body.dataset.preset = state.preset;
  presetLite.value = state.preset;
  presetStudio.value = state.preset;
  if (options.persist !== false) writeStorage(PRESET_KEY, state.preset);
  renderAll(`${getPreset(state.preset).label} preset active.`);
}

function escapeLetterClass(profile) {
  return `letter-${profile.category}`;
}

function getActiveWordBounds(value) {
  const caret = storyInput.selectionStart ?? value.length;
  let start = caret;
  let end = caret;
  while (start > 0 && /[a-zA-Z]/.test(value[start - 1])) start -= 1;
  while (end < value.length && /[a-zA-Z]/.test(value[end])) end += 1;
  return { start, end };
}

function renderLetters() {
  const value = storyInput.value;
  const bounds = getActiveWordBounds(value);
  const fragment = document.createDocumentFragment();

  if (!value) {
    const hint = document.createElement("span");
    hint.className = "empty-hint";
    hint.textContent = "Type a word or name...";
    fragment.appendChild(hint);
    letterLayer.replaceChildren(fragment);
    return;
  }

  [...value].forEach((char, index) => {
    const span = document.createElement("span");
    span.textContent = char;
    if (/[a-zA-Z]/.test(char)) {
      const profile = getLetterProfile(char, { presetId: state.preset, paletteId: state.palette, position: index });
      span.className = `letter ${escapeLetterClass(profile)}${index >= bounds.start && index < bounds.end ? " active-word" : ""}`;
      span.style.setProperty("--letter-color", profile.color);
      span.style.setProperty("--letter-glow", String(profile.glow));
      span.style.setProperty("--underline-style", profile.underlineStyle);
      span.dataset.tone = String(profile.tone.frequency);
    }
    fragment.appendChild(span);
  });

  letterLayer.replaceChildren(fragment);
  letterLayer.scrollTop = storyInput.scrollTop;
}

function getCompletedWord(value, caret) {
  const left = value.slice(0, caret).replace(/[^a-zA-Z]+$/g, "");
  return left.match(/[a-zA-Z]+$/)?.[0] || "";
}

function updateCssFromState() {
  const preset = getPreset(state.preset);
  const palette = getPalette(state.palette);
  const motion = (Number(state.intensity) / 100) * preset.motion;
  document.body.dataset.preset = state.preset;
  document.documentElement.style.setProperty("--accent", palette.accent);
  document.documentElement.style.setProperty("--motion-scale", String(clamp(motion, .25, 1.85)));
  document.documentElement.style.setProperty("--glow-strength", String(preset.glow));
  document.documentElement.style.setProperty("--particle-opacity", String(.18 + preset.particles * .18));
}

function renderMood(message) {
  const score = scoreStory(storyInput.value);
  const palette = getPalette(state.palette);
  const preset = getPreset(state.preset);
  const motion = Number(state.intensity) / 100;
  const hue = Math.round((score.warmth + palette.hueShift + (preset.hueOffset || 0)) % 360);
  const hue2 = Math.round((score.consonants * 11 + palette.hue2Shift) % 360);
  const size = state.mode === "lite" ? 30 + score.density * 14 + motion * 8 : 27 + score.density * 20 + motion * 9;

  document.documentElement.style.setProperty("--hue", String(hue));
  document.documentElement.style.setProperty("--hue2", String(hue2));
  orb.style.width = `${size}vmin`;
  orb.style.height = `${size}vmin`;

  [...wave.children].forEach((bar, index) => {
    const h = 16 + Math.abs(Math.sin((index + score.consonants) * .47)) * (54 + score.density * 112) * motion * preset.motion;
    bar.style.height = `${h}px`;
    if (state.animation === "rain") bar.style.animationDelay = `${index * 26}ms`;
    if (state.animation === "pulse") bar.style.animationDuration = `${1200 - motion * 420}ms`;
  });

  hueReadout.textContent = String(score.warmth);
  textureReadout.textContent = String(score.consonants);
  intensityReadout.textContent = `${Math.round(score.density * 100)}%`;
  if (message) status.textContent = message;
}

function renderAll(message) {
  updateCssFromState();
  renderLetters();
  renderMood(message);
  reconcileParticles();
}

function triggerLetterVisual(letter, position = 0) {
  const profile = getLetterProfile(letter, { presetId: state.preset, paletteId: state.palette, position });
  document.documentElement.style.setProperty("--hue", String(Math.round(profile.hue)));
  document.documentElement.style.setProperty("--hue2", String(Math.round((profile.hue + 178) % 360)));

  const bar = wave.children[profile.index % wave.children.length];
  if (bar?.animate) {
    bar.animate([
      { transform: "scaleY(.22)", opacity: .55 },
      { transform: "scaleY(1.15)", opacity: 1 },
      { transform: "scaleY(.45)", opacity: .72 }
    ], { duration: 360 / getPreset(state.preset).motion, easing: "ease-out" });
  }

  if (orb.animate) {
    orb.animate([
      { transform: "translate(-50%, -50%) scale(.92)" },
      { transform: "translate(-50%, -50%) scale(1.18)" },
      { transform: "translate(-50%, -50%) scale(.98)" }
    ], { duration: 420 / getPreset(state.preset).motion, easing: "ease-out" });
  }

  bursts.push({
    x: .22 + Math.random() * .2,
    y: .34 + Math.random() * .26,
    vx: (Math.random() - .5) * .002,
    vy: -Math.random() * .002,
    r: 8 + Math.random() * 12,
    life: 1,
    hue: profile.hue,
    color: profile.color
  });
}

async function handleInput(event) {
  const inserted = event.data || "";
  const caret = storyInput.selectionStart ?? storyInput.value.length;
  renderAll();

  if (inserted) {
    for (const [offset, char] of [...inserted].filter(char => /[a-zA-Z]/.test(char)).slice(0, 16).entries()) {
      const position = Math.max(0, caret - inserted.length + offset);
      triggerLetterVisual(char, position);
      await audio.playLetterTone(char, { presetId: state.preset, velocity: .92, position });
    }
    if (/[^a-zA-Z]/.test(inserted)) {
      const word = getCompletedWord(storyInput.value, caret);
      if (word) {
        audio.playWordMotif(word, { presetId: state.preset, velocity: .68 });
        status.textContent = `${word} became a short motif.`;
      }
    } else if (/[a-zA-Z]/.test(inserted)) {
      const profile = getLetterProfile(inserted.at(-1), { presetId: state.preset, paletteId: state.palette, position: Math.max(0, caret - 1) });
      status.textContent = `${inserted.at(-1).toUpperCase()} color ${Math.round(profile.hue)} and ${Math.round(profile.tone.frequency)} Hz.`;
    }
  } else if (storyInput.value.length > lastValue.length) {
    const added = storyInput.value.slice(lastValue.length);
    for (const [offset, char] of [...added].filter(char => /[a-zA-Z]/.test(char)).slice(0, 8).entries()) {
      const position = Math.max(0, lastValue.length + offset);
      triggerLetterVisual(char, position);
      audio.playLetterTone(char, { presetId: state.preset, velocity: .82, position });
    }
  }

  lastValue = storyInput.value;
}

async function playPhrase(label = "Layering the phrase into word motifs.") {
  renderAll(label);
  const words = storyInput.value.match(/[a-zA-Z]+/g) || [];
  words.slice(0, 10).forEach((word, wordIndex) => {
    setTimeout(() => {
      getWordMotif(word, { presetId: state.preset, paletteId: state.palette }).slice(0, 5).forEach(note => triggerLetterVisual(note.letter));
    }, wordIndex * 190);
  });
  const played = await audio.playPhraseMotifs(storyInput.value, { presetId: state.preset });
  if (!played && !audio.isSupported()) status.textContent = "Audio is not supported in this browser.";
}

async function copyStory() {
  try {
    await navigator.clipboard.writeText(storyInput.value);
    status.textContent = "Story copied to clipboard.";
  } catch {
    storyInput.focus();
    storyInput.select();
    status.textContent = "Copy shortcut ready: press Command+C or Ctrl+C.";
  }
}

function saveStory() {
  const blob = new Blob([storyInput.value], { type: "text/plain" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "spectramuse-story.txt";
  link.click();
  URL.revokeObjectURL(link.href);
  status.textContent = "Story text downloaded.";
}

function nextSample() {
  sampleIndex = (sampleIndex + 1) % samples.length;
  storyInput.value = samples[sampleIndex];
  lastValue = storyInput.value;
  renderAll("Sample loaded.");
}

function saveImage() {
  const words = (storyInput.value.match(/[a-zA-Z]+/g) || ["SpectraMuse"]).slice(0, 6).join(" ");
  const palette = getPalette(state.palette);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><rect width="1200" height="630" fill="#09080b"/><circle cx="385" cy="270" r="190" fill="hsl(${getComputedStyle(document.documentElement).getPropertyValue("--hue")},90%,62%)" opacity=".72"/><circle cx="780" cy="360" r="210" fill="hsl(${getComputedStyle(document.documentElement).getPropertyValue("--hue2")},90%,62%)" opacity=".58"/><text x="80" y="145" fill="#f8efe2" font-family="Courier New" font-size="76" font-weight="700">SpectraMuse</text><text x="80" y="232" fill="${palette.accent}" font-family="Courier New" font-size="42">${words.replace(/[<>&]/g, "")}</text><text x="80" y="548" fill="#f8efe2" opacity=".74" font-family="Courier New" font-size="30">Each letter has a color. Each color has a sound.</text></svg>`;
  const blob = new Blob([svg], { type: "image/svg+xml" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "spectramuse-scene.svg";
  link.click();
  URL.revokeObjectURL(link.href);
  status.textContent = "Image saved as SVG.";
}

function handleAction(action) {
  if (action === "play") playPhrase();
  if (action === "previewScene") playPhrase("Previewing scene with layered motifs.");
  if (action === "stop") { audio.stop(); status.textContent = "Sound stopped."; }
  if (action === "sample") nextSample();
  if (action === "copy") copyStory();
  if (action === "save") saveStory();
  if (action === "saveImage") saveImage();
  if (action === "storyboard") {
    state.palette = "dream";
    state.animation = "orb";
    paletteSelect.value = state.palette;
    animationStyle.value = state.animation;
    writeStorage(PALETTE_KEY, state.palette);
    writeStorage(ANIMATION_KEY, state.animation);
    renderAll("Storyboard style selected.");
  }
  if (action === "saveMp4Story") status.textContent = "MP4 story export is staged for the next engine build.";
  if (action === "saveMp4Scene") status.textContent = "MP4 scene export is staged for the next engine build.";
  if (action === "clear") {
    storyInput.value = "";
    lastValue = "";
    renderAll("Cleared. Type a word to begin.");
    storyInput.focus();
  }
}

function resize() {
  const scale = window.devicePixelRatio || 1;
  canvas.width = Math.floor(innerWidth * scale);
  canvas.height = Math.floor(innerHeight * scale);
}

function reconcileParticles() {
  const preset = getPreset(state.preset);
  const target = Math.round((state.mode === "lite" ? 72 : 122) * preset.particles);
  while (particles.length < target) particles.push(createParticle());
  particles = particles.slice(0, target);
}

function createParticle() {
  return {
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.7 + .35,
    v: Math.random() * .00075 + .00018,
    hue: Math.random() * 360
  };
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const scale = window.devicePixelRatio || 1;
  const preset = getPreset(state.preset);
  const motion = clamp((Number(state.intensity) / 100) * preset.motion, .25, 1.85);
  ctx.globalCompositeOperation = "lighter";

  for (const particle of particles) {
    particle.y -= particle.v * motion;
    if (state.animation === "rain") particle.x += Math.sin(particle.y * 22) * .00018;
    if (particle.y < -0.02) {
      particle.y = 1.02;
      particle.x = Math.random();
    }
    ctx.fillStyle = `hsla(${particle.hue}, 85%, 78%, ${Number(getComputedStyle(document.documentElement).getPropertyValue("--particle-opacity"))})`;
    ctx.beginPath();
    ctx.arc(particle.x * canvas.width, particle.y * canvas.height, particle.r * scale, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = bursts.length - 1; i >= 0; i -= 1) {
    const burst = bursts[i];
    burst.life -= 0.025 / motion;
    burst.x += burst.vx * motion;
    burst.y += burst.vy * motion;
    if (burst.life <= 0) {
      bursts.splice(i, 1);
      continue;
    }
    ctx.strokeStyle = `hsla(${burst.hue}, 100%, 72%, ${burst.life})`;
    ctx.lineWidth = Math.max(1, 2.4 * scale * burst.life);
    ctx.beginPath();
    ctx.arc(burst.x * canvas.width, burst.y * canvas.height, burst.r * scale * (1.4 - burst.life), 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(draw);
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click", () => handleAction(button.dataset.action));
});

document.querySelectorAll("[data-mode-target]").forEach(button => {
  button.addEventListener("click", () => setMode(button.dataset.modeTarget));
});

[presetLite, presetStudio].forEach(select => {
  select.addEventListener("change", () => setPreset(select.value));
});

paletteSelect.addEventListener("change", () => {
  state.palette = paletteSelect.value;
  writeStorage(PALETTE_KEY, state.palette);
  renderAll(`${getPalette(state.palette).label} style active.`);
});

animationStyle.addEventListener("change", () => {
  state.animation = animationStyle.value;
  writeStorage(ANIMATION_KEY, state.animation);
  renderAll("Animation style updated.");
});

intensity.addEventListener("input", () => {
  state.intensity = Number(intensity.value);
  writeStorage(INTENSITY_KEY, String(state.intensity));
  renderAll("Motion intensity updated.");
});

storyInput.addEventListener("input", handleInput);
storyInput.addEventListener("select", renderLetters);
storyInput.addEventListener("keyup", renderLetters);
storyInput.addEventListener("click", renderLetters);
storyInput.addEventListener("scroll", () => {
  letterLayer.scrollTop = storyInput.scrollTop;
});

["pointerdown", "touchstart", "keydown"].forEach(eventName => {
  document.addEventListener(eventName, () => {
    audio.unlock().then(unlocked => {
      if (unlocked && status.textContent === "Ready.") status.textContent = "Audio unlocked. Type a letter.";
    });
  }, { passive: true });
});

addEventListener("resize", resize);
resize();
populatePaletteSelect();
animationStyle.value = state.animation;
intensity.value = String(state.intensity);
setMode(state.mode, { persist: false });
setPreset(state.preset, { persist: false });
renderAll("Ready.");
draw();

window.SpectraMuse = {
  getMode: () => state.mode,
  setMode,
  getPreset: () => state.preset,
  setPreset,
  getLetterProfile: letter => getLetterProfile(letter, { presetId: state.preset, paletteId: state.palette }),
  playPhrase
};
</script>
</body>
</html>
